<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>App walkthrough</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #121a2b;
      --ink: #e8eef8;
      --muted: #93a0b8;
      --accent: #38bdf8;
      --good: #6ee7b7;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .stage {
      width: min(920px, 100%);
      background: var(--panel);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0,0,0,.35);
    }
    .screen {
      position: relative;
      aspect-ratio: 16 / 9;
      background:
        radial-gradient(circle at 20% 20%, #1d4ed8 0, transparent 40%),
        radial-gradient(circle at 80% 70%, #0f766e 0, transparent 42%),
        #0f172a;
      display: grid;
      place-items: center;
      padding: 32px;
    }
    .card {
      text-align: center;
      max-width: 34rem;
    }
    .kicker {
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: 12px;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .onscreen {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 700;
      line-height: 1.15;
      margin: 0 0 16px;
    }
    .visual {
      color: var(--muted);
      margin: 0;
      font-size: 16px;
    }
    .badge {
      position: absolute;
      top: 16px;
      right: 16px;
      background: var(--warn);
      color: #111;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      display: none;
    }
    .badge.show { display: inline-block; }
    .bar {
      height: 4px;
      background: #1e293b;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--good);
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 14px 16px 18px;
    }
    button {
      background: #1e293b;
      color: var(--ink);
      border: 0;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button:hover { background: #334155; }
    .voice {
      flex: 1;
      color: var(--muted);
      font-size: 14px;
    }
    .time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <article class="stage">
    <div class="screen">
      <span class="badge" id="ph">PLACEHOLDER</span>
      <div class="card">
        <p class="kicker" id="title">Scene</p>
        <p class="onscreen" id="onscreen">On-screen copy</p>
        <p class="visual" id="visual">Visual</p>
      </div>
    </div>
    <div class="bar"><i id="progress"></i></div>
    <div class="controls">
      <button type="button" id="prev" aria-label="Previous">Prev</button>
      <button type="button" id="play" aria-label="Play or pause">Play</button>
      <button type="button" id="next" aria-label="Next">Next</button>
      <p class="voice" id="voice">Voiceover</p>
      <span class="time" id="time">0:00 / 0:00</span>
    </div>
  </article>
  <script>
    // Replace this array with the walkthrough scenes.
    const SCENES = [
      {
        id: "hook",
        seconds: 5,
        title: "Hook",
        visual: "Product name and the job-to-be-done",
        onScreen: "See the first win",
        voice: "This walkthrough shows the first success path.",
        placeholder: true
      },
      {
        id: "action",
        seconds: 8,
        title: "Action",
        visual: "The key click or screen",
        onScreen: "Do the main action",
        voice: "Complete the step that creates value.",
        placeholder: true
      },
      {
        id: "cta",
        seconds: 5,
        title: "CTA",
        visual: "End card with URL",
        onScreen: "Try it next",
        voice: "Open the app and repeat this path.",
        placeholder: true
      }
    ];

    const $ = (id) => document.getElementById(id);
    let index = 0;
    let playing = false;
    let started = 0;
    let elapsed = 0;
    let raf = 0;

    const total = () => SCENES.reduce((n, s) => n + s.seconds, 0);

    function fmt(sec) {
      const s = Math.max(0, Math.floor(sec));
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    function show(i) {
      const scene = SCENES[i];
      if (!scene) return;
      $("title").textContent = scene.title;
      $("onscreen").textContent = scene.onScreen;
      $("visual").textContent = scene.visual;
      $("voice").textContent = scene.voice;
      $("ph").classList.toggle("show", Boolean(scene.placeholder));
      stamp();
    }

    function stamp() {
      const before = SCENES.slice(0, index).reduce((n, s) => n + s.seconds, 0);
      const scene = SCENES[index];
      const local = Math.min(elapsed, scene.seconds);
      $("time").textContent = `${fmt(before + local)} / ${fmt(total())}`;
      $("progress").style.width = `${((before + local) / total()) * 100}%`;
    }

    function tick(now) {
      if (!playing) return;
      elapsed += (now - started) / 1000;
      started = now;
      const scene = SCENES[index];
      if (elapsed >= scene.seconds) {
        if (index < SCENES.length - 1) {
          index += 1;
          elapsed = 0;
          show(index);
        } else {
          playing = false;
          $("play").textContent = "Play";
          elapsed = scene.seconds;
          stamp();
          return;
        }
      } else {
        stamp();
      }
      raf = requestAnimationFrame(tick);
    }

    function play() {
      playing = !playing;
      $("play").textContent = playing ? "Pause" : "Play";
      if (playing) {
        started = performance.now();
        raf = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(raf);
      }
    }

    $("play").onclick = play;
    $("prev").onclick = () => {
      index = Math.max(0, index - 1);
      elapsed = 0;
      show(index);
    };
    $("next").onclick = () => {
      index = Math.min(SCENES.length - 1, index + 1);
      elapsed = 0;
      show(index);
    };

    show(0);
  </script>
</body>
</html>
